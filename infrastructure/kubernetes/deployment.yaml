apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-api
  labels:
    app: athena-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: athena-api
  template:
    metadata:
      labels:
        app: athena-api
    spec:
      containers:
        - name: athena-api
          image: athena-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: LIVE_TRADING_ENABLED
              value: "false"
            - name: EXECUTION_MODE
              value: "PAPER"
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: athena-api-service
spec:
  selector:
    app: athena-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
