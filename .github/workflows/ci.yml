name: ATHENA CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff black pytest pytest-asyncio aiosqlite email-validator

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Code Formatter Check
        run: black --check .

      - name: Run Automated Test Suite
        run: pytest tests/ -v --maxfail=1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Web Frontend
        run: |
          cd apps/web
          npm ci || npm install
          npm run build
