version: '3.8'

services:
  # Database: PostgreSQL with TimescaleDB & pgvector
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: athena-timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: athena_db
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d athena_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - athena-network

  # Cache & Ephemeral State
  redis:
    image: redis:7-alpine
    container_name: athena-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - athena-network

  # Event Bus Messaging: Zookeeper & Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: athena-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - athena-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: athena-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - athena-network

  # Core API Service & AI Execution Gateway
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: athena-api
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@timescaledb:5432/athena_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_USE_LOCAL_BUS: "false"
    volumes:
      - .:/app
    networks:
      - athena-network

  # Institutional Web Dashboard (Next.js)
  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: athena-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/stream
    networks:
      - athena-network

  # Observability: Prometheus
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: athena-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - athena-network

  # Observability: Grafana
  grafana:
    image: grafana/grafana:10.3.3
    container_name: athena-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - athena-network

volumes:
  timescale_data:
  redis_data:
  grafana_data:

networks:
  athena-network:
    driver: bridge
